<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Cyan to Emerald) -->
    <linearGradient id="mediscan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with App Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mediscan-grad)" />

  <!-- Subtle inner border for crisp definition -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Medical Cross / Pill AI Symbol -->
  <g filter="url(#glow)">
    <!-- Vertical bar of medical cross -->
    <rect x="26" y="14" width="12" height="36" rx="6" fill="#ffffff" />
    <!-- Horizontal bar of medical cross -->
    <rect x="14" y="26" width="36" height="12" rx="6" fill="#ffffff" />

    <!-- Center AI Scanning Diamond -->
    <path d="M32 23 L37 32 L32 41 L27 32 Z" fill="#0ea5e9" opacity="0.9" />
    
    <!-- AI Sparkle in top right corner -->
    <path d="M49 10 C49 13.5 50.5 15 54 15 C50.5 15 49 16.5 49 20 C49 16.5 47.5 15 44 15 C47.5 15 49 13.5 49 10 Z" fill="#ffffff" />
  </g>
</svg>
